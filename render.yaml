services:
  - type: web
    name: taskadmin
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskadmindb
          property: connectionString
      - key: PORT
        value: 8080

databases:
  - name: taskadmindb
    plan: free
    databaseName: taskadmindb_2i4k
    user: taskadmindb_2i4k_user
