<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Task Manager</h1>
    </header>

    <main>
      <div id="flash" class="flash hidden"></div>

      <section id="page-create">
        <h2>Create a New Task</h2>
        <form id="task-form">
          <div class="form-group">
            <label for="task-title">Title *</label>
            <input type="text" id="task-title" maxlength="200" required placeholder="Enter task title">
          </div>
          <div class="form-group">
            <label for="task-desc">Description</label>
            <textarea id="task-desc" maxlength="2000" placeholder="Enter task description" rows="4"></textarea>
          </div>
          <button type="submit" id="submit-btn">Create Task</button>
        </form>
      </section>

      <section id="page-list">
        <h2>All Tasks</h2>
        <div id="task-list">
          <p class="empty-state">No tasks yet</p>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
